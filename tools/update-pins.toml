# Update recipes for packages nix-update cannot drive: content pinned
# without a releasable version (rolling HEADs), or version/hash data spread
# over several release assets. Executed by tools/update-pins; that script's
# docstring documents the spec kinds, fields, transforms and template rules.
#
# A rule is evaluated in declaration order: sources first, then derived
# values, then pins. Pins capture their current value into the namespace
# first and are rewritten only once every value is known; for multi-file
# rules (packages glob) each file is processed separately and all changed
# files are committed together with the rule's commit message.
#
# The [meta] table is not a rule: it tells the update workflow how to drive
# the packages outside of these recipes, and is consumed by
# `tools/update-pins --print-config` (JSON on stdout).

[meta]
# App directories not driven by nix-update because their updates run
# through a rule here (honk's single pin feeds the honk-stock variant too,
# fcitx5-theme-collect follows a rolling HEAD, axolotl-launcher releases
# through the Update Server, and mark-shot, windinput and venera-next publish
# one asset per architecture — under nix-update a single run would refresh
# only the running platform's hash).
managed = ["honk", "honk-stock", "fcitx5-theme-collect", "axolotl-launcher", "mark-shot", "windinput", "venera-next"]

# Extra nix-update flags per app directory.
[meta.nix-update]
# nix-update ignores pre-releases by default; doona only publishes those.
doona = "--version=unstable"

# honk follows its own repo (daeuniverse/honk; Zakkaus/doona releases no
# longer carry the honk builds). Only SemVer tags are tracked — rolling
# "debug"-tagged release channels and CI test tags are skipped. On glibc
# only the -full and -stock-full assets exist; both carry both APIs and
# the embedded doona UI (musl builds are static and split per API — not
# packaged).
[honk]
package = "packages/apps/honk/packages/honk.nix"
commit = "honk: {old.pin-version} -> {release.tag}"

[honk.release]
github = "daeuniverse/honk"
tag = "^v[0-9][0-9A-Za-z.-]*$"

[honk.hash-x86_64]
doc = "release"
digest_of = "honk-core-{release.tag}-x86_64-unknown-linux-gnu-full.tar.gz"
transform = "sri"

[honk.hash-aarch64]
doc = "release"
digest_of = "honk-core-{release.tag}-aarch64-unknown-linux-gnu-full.tar.gz"
transform = "sri"

[honk.hash-stock-x86_64]
doc = "release"
digest_of = "honk-core-{release.tag}-x86_64-unknown-linux-gnu-stock-full.tar.gz"
transform = "sri"

[honk.hash-stock-aarch64]
doc = "release"
digest_of = "honk-core-{release.tag}-aarch64-unknown-linux-gnu-stock-full.tar.gz"
transform = "sri"

[honk.pin-version]
pattern = '  version = "(.*)";'
value = "{release.tag}"

[honk.pin-hash-x86]
pattern = '  hashes\.x86_64-linux\.full = "(.*)";'
value = "{hash-x86_64}"

[honk.pin-hash-aarch64]
pattern = '  hashes\.aarch64-linux\.full = "(.*)";'
value = "{hash-aarch64}"

[honk.pin-hash-stock-x86]
pattern = '  hashes\.x86_64-linux\.stock = "(.*)";'
value = "{hash-stock-x86_64}"

[honk.pin-hash-stock-aarch64]
pattern = '  hashes\.aarch64-linux\.stock = "(.*)";'
value = "{hash-stock-aarch64}"

# fcitx5-theme-collect follows a rolling branch; the commit date becomes
# the version suffix and the flake prefetch supplies the hash.
[fcitx5-theme-collect]
package = "packages/apps/fcitx5-theme-collect/package.nix"
commit = "fcitx5-theme-collect: {old.pin-rev} -> {head-sha}"

[fcitx5-theme-collect.head-commit]
url = "https://api.github.com/repos/zno233/fcitx5-theme-collect/commits/HEAD"
json = true

[fcitx5-theme-collect.head-sha]
doc = "head-commit"
json_path = "sha"
validate = "[0-9a-f]{40}"
transform = "short"

[fcitx5-theme-collect.head-date]
doc = "head-commit"
json_path = "commit.committer.date"
transform = "iso"

[fcitx5-theme-collect.head-hash]
prefetch = "github:zno233/fcitx5-theme-collect/{head-sha}"
json_path = "hash"

[fcitx5-theme-collect.pin-rev]
pattern = '    rev = "(.*)";'
value = "{head-sha}"

[fcitx5-theme-collect.pin-version]
pattern = '  version = "(.*)";'
value = "0-unstable-{head-date}"

[fcitx5-theme-collect.pin-hash]
pattern = '    hash = "(.*)";'
value = "{head-hash}"

# Apple serves the dmg URLs from a rolling catalog, so the URL is captured
# from the package itself and the hash is recomputed from that download.
[apple]
packages = "packages/fonts/apple/*/package.nix"
commit = "apple-fonts: refresh dmg hashes ({changed})"

[apple.pin-url]
pattern = '    url = "(.*)";'
value = "{pin-url}"
validate = "^https://devimages-cdn\\.apple\\.com/design/resources/download/.*\\.dmg$"

[apple.pin-hash]
pattern = '    hash = "(.*)";'
value = "{pin-url:dmghash}"

# Axolotl Launcher publishes installers through its own Update Server (the
# same feed the official website's download section consumes), so no
# nix-update version fetcher can see it. This rule replays the official
# catalog — https://update.axlmc.org/api/downloads/latest?channel=release —
# which names the version and, per installer, the sha256 of every artifact,
# so the CDN deb is never downloaded just to be hashed (the catalog hash is
# the same value the launcher's own updater verifies). The regexes match
# the raw catalog document; the deb objects are flat, so [^}]* stays
# inside them. Both published debs (amd64/arm64) are replayed.
[axolotl-launcher]
package = "packages/apps/axolotl-launcher/package.nix"
commit = "axolotl-launcher: {old.pin-version} -> {axolotl-version}"

[axolotl-launcher.catalog]
url = "https://update.axlmc.org/api/downloads/latest?channel=release"

[axolotl-launcher.axolotl-version]
doc = "catalog"
regex = '"version":"([0-9][0-9A-Za-z.+-]*)"'
validate = "^[0-9][0-9A-Za-z.+-]*$"

[axolotl-launcher.sum-amd64]
doc = "catalog"
regex = '"filename":"Axolotl\.Launcher_{axolotl-version}_amd64\.deb"[^}]*?"sha256":"([0-9a-f]{64})"'
validate = "^[0-9a-f]{64}$"
transform = "sri"

[axolotl-launcher.sum-arm64]
doc = "catalog"
regex = '"filename":"Axolotl\.Launcher_{axolotl-version}_arm64\.deb"[^}]*?"sha256":"([0-9a-f]{64})"'
validate = "^[0-9a-f]{64}$"
transform = "sri"

[axolotl-launcher.pin-version]
pattern = '  version = "(.*)";'
value = "{axolotl-version}"

[axolotl-launcher.pin-hash-amd64]
pattern = '  hashes\.x86_64-linux = "(.*)";'
value = "{sum-amd64}"

[axolotl-launcher.pin-hash-arm64]
pattern = '  hashes\.aarch64-linux = "(.*)";'
value = "{sum-arm64}"

# mark-shot ships one native tarball per architecture; GitHub records the
# sha256 of every release asset, so both hashes come from the API without
# downloading the 60 MB of tarballs.
[mark-shot]
package = "packages/apps/mark-shot/package.nix"
commit = "mark-shot: {old.pin-version} -> {release.version}"

[mark-shot.release]
github = "jswysnemc/mark-shot"

[mark-shot.hash-x86]
doc = "release"
digest_of = "mark-shot-native-{release.version}-linux-x86_64.tar.gz"
transform = "sri"

[mark-shot.hash-arm64]
doc = "release"
digest_of = "mark-shot-native-{release.version}-linux-aarch64.tar.gz"
transform = "sri"

[mark-shot.pin-version]
pattern = '  version = "(.*)";'
value = "{release.version}"

[mark-shot.pin-hash-x86]
pattern = '    x86_64-linux = "(sha256-[A-Za-z0-9+/=]+)";'
value = "{hash-x86}"

[mark-shot.pin-hash-arm64]
pattern = '    aarch64-linux = "(sha256-[A-Za-z0-9+/=]+)";'
value = "{hash-arm64}"

# windinput publishes one deb per architecture, both digested in the
# release API, so no sidecar download is needed.
[windinput]
package = "packages/apps/windinput/package.nix"
commit = "windinput: {old.pin-version} -> {release.version}"

[windinput.release]
github = "huanfeng/WindInput"

[windinput.hash-amd64]
doc = "release"
digest_of = "WindInput-{release.version}-linux-amd64.deb"
transform = "sri"

[windinput.hash-arm64]
doc = "release"
digest_of = "WindInput-{release.version}-linux-arm64.deb"
transform = "sri"

[windinput.pin-version]
pattern = '  version = "(.*)";'
value = "{release.version}"

[windinput.pin-hash-amd64]
pattern = '    x86_64-linux = "(sha256-[A-Za-z0-9+/=]+)";'
value = "{hash-amd64}"

[windinput.pin-hash-arm64]
pattern = '    aarch64-linux = "(sha256-[A-Za-z0-9+/=]+)";'
value = "{hash-arm64}"

# venera-next publishes one deb per architecture; both digests are in the
# release API, so no asset download is needed.
[venera-next]
package = "packages/apps/venera-next/package.nix"
commit = "venera-next: {old.pin-version} -> {release.version}"

[venera-next.release]
github = "CyrilPeng/Venera-Next"

[venera-next.hash-amd64]
doc = "release"
digest_of = "venera-next_{release.version}_amd64.deb"
transform = "sri"

[venera-next.hash-arm64]
doc = "release"
digest_of = "venera-next_{release.version}_arm64.deb"
transform = "sri"

[venera-next.pin-version]
pattern = '  version = "(.*)";'
value = "{release.version}"

[venera-next.pin-hash-amd64]
pattern = '    x86_64-linux = "(sha256-[A-Za-z0-9+/=]+)";'
value = "{hash-amd64}"

[venera-next.pin-hash-arm64]
pattern = '    aarch64-linux = "(sha256-[A-Za-z0-9+/=]+)";'
value = "{hash-arm64}"
