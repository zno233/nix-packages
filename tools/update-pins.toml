# Update recipes for pins that nix-update cannot drive: content pinned
# without a releasable version (rolling HEADs), or version/hash data spread
# over several release assets. Executed by tools/update-pins.
#
# A rule lists specs in declaration order. Every spec is a fetch
# (url: plain/JSON text; prefetch: nix flake prefetch), a find
# (doc + tag regex and/or asset name(s): first item of a listed doc
# matching them, e.g. the newest release of a channel that still ships
# the assets), a derivation (doc + json_path or regex, narrowed by
# validate / transform; the regex is a token template — unresolvable
# braces such as {64} quantifiers stay literal) or a pin
# (pattern + value): pins capture their current value into the namespace
# first and are rewritten once all values are known. Patterns are matched
# per line; the captured group is replaced by template. For multi-file
# rules (packages glob) each file is processed separately and all changed
# files are committed together with the rule's commit message.
#
# Supported transforms live in tools/update-pins TRANSFORMS: sri (hex
# sha256 -> SRI), dmghash (download URL -> SRI, cached per URL), short
# (first 7 chars) and iso (timestamp -> YYYY-MM-DD UTC).
#
# The [meta] table is not a rule: it tells the update workflow how to
# drive the packages outside of these recipes, and is consumed by
# `tools/update-pins --print-config` (JSON on stdout).

[meta]
# App directories not driven by nix-update because their updates run
# through a rule here (honk's single pin feeds the honk-stock variant too,
# fcitx5-theme-collect follows a rolling HEAD, and axolotl-launcher
# releases through the Update Server — under nix-update a single run
# would refresh only the running platform's hash).
managed = ["honk", "honk-stock", "fcitx5-theme-collect", "axolotl-launcher"]

# Extra nix-update flags per app directory.
[meta.nix-update]
# nix-update ignores pre-releases by default; doona only publishes those.
doona = "--version=unstable"

[honk]
package = "packages/apps/honk/packages/honk.nix"
commit = "honk: {old.pin-version} -> {honk-tag}"

# honk follows its own repo (daeuniverse/honk; Zakkaus/doona releases no
# longer carry the honk builds). Only SemVer tags are tracked — rolling
# "debug"-tagged release channels and CI test tags are skipped. On glibc
# only the -full and -stock-full assets exist; both carry both APIs and
# the embedded doona UI (musl builds are static and split per API — not
# packaged).
[honk.honk-releases]
url = "https://api.github.com/repos/daeuniverse/honk/releases?per_page=100"
json = true

[honk.honk-release]
find = "honk-releases"
tag = "^v[0-9][0-9A-Za-z.-]*$"

[honk.honk-tag]
doc = "honk-release"
json_path = "tag_name"
validate = "^v[0-9][0-9A-Za-z.-]*$"

[honk.sums]
url = "https://github.com/daeuniverse/honk/releases/download/{honk-tag}/SHA256SUMS"

[honk.hash-x86_64]
doc = "sums"
regex = "^ ?([0-9a-f]+)  honk-core-{honk-tag}-x86_64-unknown-linux-gnu-full\\.tar\\.gz$"
transform = "sri"

[honk.hash-aarch64]
doc = "sums"
regex = "^ ?([0-9a-f]+)  honk-core-{honk-tag}-aarch64-unknown-linux-gnu-full\\.tar\\.gz$"
transform = "sri"

[honk.hash-stock-x86_64]
doc = "sums"
regex = "^ ?([0-9a-f]+)  honk-core-{honk-tag}-x86_64-unknown-linux-gnu-stock-full\\.tar\\.gz$"
transform = "sri"

[honk.hash-stock-aarch64]
doc = "sums"
regex = "^ ?([0-9a-f]+)  honk-core-{honk-tag}-aarch64-unknown-linux-gnu-stock-full\\.tar\\.gz$"
transform = "sri"

[honk.pin-version]
pattern = '  version = "(.*)";'
value = "{honk-tag}"

[honk.pin-hash-x86]
pattern = '  hashes\.x86_64-linux\.full = "(.*)";'
value = "{hash-x86_64}"

[honk.pin-hash-aarch64]
pattern = '  hashes\.aarch64-linux\.full = "(.*)";'
value = "{hash-aarch64}"

[honk.pin-hash-stock-x86]
pattern = '  hashes\.x86_64-linux\.stock = "(.*)";'
value = "{hash-stock-x86_64}"

[honk.pin-hash-stock-aarch64]
pattern = '  hashes\.aarch64-linux\.stock = "(.*)";'
value = "{hash-stock-aarch64}"

[fcitx5-theme-collect]
package = "packages/apps/fcitx5-theme-collect/package.nix"
commit = "fcitx5-theme-collect: {old.pin-rev} -> {head-sha}"

[fcitx5-theme-collect.head-commit]
url = "https://api.github.com/repos/zno233/fcitx5-theme-collect/commits/HEAD"
json = true

[fcitx5-theme-collect.head-sha]
doc = "head-commit"
json_path = "sha"
validate = "[0-9a-f]{40}"
transform = "short"

[fcitx5-theme-collect.head-date]
doc = "head-commit"
json_path = "commit.committer.date"
transform = "iso"

[fcitx5-theme-collect.head-hash]
prefetch = "github:zno233/fcitx5-theme-collect/{head-sha}"
json_path = "hash"

[fcitx5-theme-collect.pin-rev]
pattern = '    rev = "(.*)";'
value = "{head-sha}"

[fcitx5-theme-collect.pin-version]
pattern = '  version = "(.*)";'
value = "0-unstable-{head-date}"

[fcitx5-theme-collect.pin-hash]
pattern = '    hash = "(.*)";'
value = "{head-hash}"

[apple]
packages = "packages/fonts/apple/*/package.nix"
commit = "apple-fonts: refresh dmg hashes ({changed})"

[apple.pin-url]
pattern = '    url = "(.*)";'
value = "{pin-url}"
validate = "^https://devimages-cdn\\.apple\\.com/design/resources/download/.*\\.dmg$"

[apple.pin-hash]
pattern = '    hash = "(.*)";'
value = "{pin-url:dmghash}"

# Axolotl Launcher publishes installers through its own Update Server (the
# same feed the official website's download section consumes), so no
# nix-update version fetcher can see it. This rule replays the official
# catalog — https://update.axlmc.org/api/downloads/latest?channel=release —
# which names the version and, per installer, the sha256 of every artifact,
# so the CDN deb is never downloaded just to be hashed (the catalog hash is
# the same value the launcher's own updater verifies). The regexes match
# the raw catalog document; the deb objects are flat, so [^}]* stays
# inside them. Both published debs (amd64/arm64) are replayed.
[axolotl-launcher]
package = "packages/apps/axolotl-launcher/package.nix"
commit = "axolotl-launcher: {old.pin-version} -> {axolotl-version}"

[axolotl-launcher.catalog]
url = "https://update.axlmc.org/api/downloads/latest?channel=release"

[axolotl-launcher.axolotl-version]
doc = "catalog"
regex = '"version":"([0-9][0-9A-Za-z.+-]*)"'
validate = "^[0-9][0-9A-Za-z.+-]*$"

[axolotl-launcher.sum-amd64]
doc = "catalog"
regex = '"filename":"Axolotl\.Launcher_{axolotl-version}_amd64\.deb"[^}]*?"sha256":"([0-9a-f]{64})"'
validate = "^[0-9a-f]{64}$"
transform = "sri"

[axolotl-launcher.sum-arm64]
doc = "catalog"
regex = '"filename":"Axolotl\.Launcher_{axolotl-version}_arm64\.deb"[^}]*?"sha256":"([0-9a-f]{64})"'
validate = "^[0-9a-f]{64}$"
transform = "sri"

[axolotl-launcher.pin-version]
pattern = '  version = "(.*)";'
value = "{axolotl-version}"

[axolotl-launcher.pin-hash-amd64]
pattern = '  hashes\.x86_64-linux = "(.*)";'
value = "{sum-amd64}"

[axolotl-launcher.pin-hash-arm64]
pattern = '  hashes\.aarch64-linux = "(.*)";'
value = "{sum-arm64}"
