name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.1
        with:
          # No install_url pin: Nix follows the action's bundled default, so
          # Dependabot's action bumps also carry the Nix version forward.
          extra_nix_config: |
            accept-flake-config = false
            builders =
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix fmt -- --fail-on-change

      - name: Lint shell sources
        run: nix run .#shellcheck -- tools/gen-ms-sources/gen.sh

      - name: Statix (Nix lint)
        run: nix run .#statix -- check

      - name: Deadnix (unused declarations)
        run: nix run .#deadnix -- -L --fail -- .

      - name: Check flake and build packages
        run: nix flake check --print-build-logs --no-update-lock-file --no-write-lock-file
