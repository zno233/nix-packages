name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.34.8/install
          extra_nix_config: |
            accept-flake-config = false
            builders =
            experimental-features = nix-command flakes

      - name: Check flake and build packages
        run: nix flake check --print-build-logs --no-update-lock-file --no-write-lock-file
