name: Sync fonts

on:
  schedule:
    # GitHub cron is UTC-only: 20:47 UTC == 04:47 Beijing time (next day).
    - cron: "47 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fonts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.1
        with:
          # No install_url pin: Nix follows the action's bundled default, so
          # Dependabot's action bumps also carry the Nix version forward.
          extra_nix_config: |
            accept-flake-config = false
            builders =
            experimental-features = nix-command flakes

      - name: Fetch upstream
        run: git clone --depth 1 https://github.com/brsvh/chinese-fonts-overlay /tmp/cfo

      - name: Rsync vendor trees
        # packages/fonts/<vendor> mirrors the upstream byte-for-byte, except
        # the locally maintained apple/, zno/, and microsoft/ trees, which
        # survive --delete via the excludes. Vendor registration is
        # automatic (overlays/fonts/vendor-names.nix derives the scopes and
        # `<vendor>-fonts` aggregates from the directory listing), so a new
        # upstream vendor needs no overlay edit. tools/gen-ms-sources is
        # local too (upstream has none): regenerate its sources.nix
        # manually with tools/gen-ms-sources/gen.sh when the upstream
        # microsoft tree changes.
        #
        # Upstream is not fully nixfmt-formatted, so run the repo formatter
        # after every sync to keep the tree constant for review.
        run: |
          rsync -a --delete \
            --exclude=/apple/ --exclude=/zno/ --exclude=/microsoft/ \
            /tmp/cfo/packages/ packages/fonts/
          nix fmt

      - name: Detect changes
        id: diff
        # Capture the changelist before the commit: once committed, index
        # == HEAD and `git diff --cached` is empty, which used to blind the
        # Verify step entirely (it silently skipped the per-vendor builds).
        # Everything is staged here, so the output stays complete for
        # paths the Verify step filters down to.
        run: |
          git add -A
          files="$(git diff --cached --name-only)"
          if [ -n "$files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<SYNC_DIFF_EOF"
              echo "$files"
              echo "SYNC_DIFF_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes locally
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: update font tree from chinese-fonts-overlay"

      - name: Verify
        # The runner store is cold every run, so only pay the font
        # re-download cost when the tree actually changed. --no-build
        # already evaluates every package output (including apple-fonts),
        # and the changelist captured in the Detect step names the upstream
        # vendors whose aggregate is actually built — locally maintained
        # trees (apple, zno) get the same treatment whenever their copies
        # change here. Registration is derived from the directory tree, so
        # an aggregate for every changed vendor must exist; a missing one
        # fails `nix build` evaluation loudly.
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          nix flake check --no-build --no-update-lock-file --no-write-lock-file

          # Vendor names are derived inline in the for header so the word
          # splitting is command-substitution based (reliable across
          # shells); a vendor whose directory the sync deleted (upstream
          # removals survive --delete here) simply yields no build.
          builds=""
          for vendor in $(awk -F/ '$1 == "packages" && $2 == "fonts" { print $3 }' \
              <<<"${{ steps.diff.outputs.files }}" | sort -u); do
            # every vendor directory registers a `<vendor>-fonts` aggregate
            if [ -d "packages/fonts/$vendor" ]; then
              builds="$builds .#$vendor-fonts"
            fi
          done
          if [ -n "$builds" ]; then
            nix build $builds --no-link \
              --no-update-lock-file --no-write-lock-file
          fi

      - name: Push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git pull --rebase origin main
          git push