name: Update packages

on:
  schedule:
    # GitHub cron is UTC-only: 20:23 UTC == 04:23 Beijing time (next day).
    - cron: "23 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.2
        with:
          # No install_url pin: Nix follows the action's bundled default, so
          # Dependabot's action bumps also carry the Nix version forward.
          extra_nix_config: |
            accept-flake-config = false
            builders =
            experimental-features = nix-command flakes

      - name: Update packages
        id: update
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Inputs: nixpkgs only; fonts are vendored and refreshed by
          # sync-fonts.yml from chinese-fonts-overlay.
          nix flake update
          if [ -n "$(git status --porcelain -- flake.lock)" ]; then
            git add flake.lock
            git commit -m "lock: update flake inputs"
          fi

          # Per-package updates; a single failure must not block the rest.
          failed_pkgs=""

          echo "::group::Update pins"
          ./tools/update-pins || failed_pkgs="update-pins"
          echo "::endgroup::"

          # Which packages nix-update drives and with which flags comes from
          # tools/update-pins.toml ([meta], via --print-config) so it can
          # never drift from the pin rules the workflow skips.
          config=$(./tools/update-pins --print-config)
          managed=" $(jq -r '.managed | join(" ")' <<<"$config") "

          for dir in packages/apps/*/; do
            pkg=${dir%/}
            pkg=${pkg##*/}
            case "$managed" in
              *" $pkg "*) continue ;;
            esac

            flags=$(jq -r --arg pkg "$pkg" '.nix_update[$pkg] // [] | join(" ")' <<<"$config")

            echo "::group::Update $pkg"
            nix run .#nix-update -- --commit --flake $flags "$pkg" || {
              failed_pkgs="$failed_pkgs $pkg"
            }
            echo "::endgroup::"
          done

          # Font changes committed this run (sync-fonts.yml builds the
          # affected vendors itself, this covers every other path in)
          # also get build coverage: the vendored trees have no flake
          # input whose CI build failure could surface for them.
          vendors=$({ git diff --cached --name-only; git diff --name-only '@{u}'; } \
            | grep '^packages/fonts/' | cut -d/ -f3 | sort -u | tr '\n' ' ')
          if [ -n "$vendors" ]; then
            echo "::group::Build changed font vendors ($vendors)"
            for vendor in $vendors; do
              nix build ".#$vendor-fonts" --no-link \
                --no-update-lock-file --no-write-lock-file || failed_pkgs="$failed_pkgs $vendor-fonts"
            done
            echo "::endgroup::"
          fi

          # Pass failure info as data so Check and push still runs.
          if [ -n "$failed_pkgs" ]; then
            failed_pkgs="${failed_pkgs# }"
            echo "failed=$failed_pkgs" >> "$GITHUB_OUTPUT"
          fi

      - name: Check and push
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          # Nothing new? Skip the (expensive) rebuild checks entirely;
          # the runner store is cold every run.
          if [ "$(git rev-list --count '@{u}..HEAD')" -eq 0 ]; then
            echo "No updates to push"
            exit 0
          fi

          # Never push updates that fail evaluation or builds.
          nix flake check --print-build-logs --no-update-lock-file --no-write-lock-file

          git pull --rebase origin main
          git push

      # Fail the job so the run is ❌ in the Actions list. Successful
      # commits (if any) were already checked and pushed above.
      - name: Fail if any package update failed
        if: steps.update.outputs.failed != ''
        run: |
          failed="${{ steps.update.outputs.failed }}"
          echo "::error title=Package update(s) failed::${failed}"
          {
            echo "## Package update failed"
            echo
            echo "**Failed:** \`${failed}\`"
            echo
            echo "Successful commits (if any) were still checked and pushed above."
            echo "This job is marked failed only so the run shows as failed in the Actions list."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1